plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

ext {
    mod_id = 'ninjacatlib'
    mod_name = 'Ninjacat Lib'
    mod_description = 'Shared utilities for Ninjacat Skies mods.'
}
apply from: rootProject.file('neoforge-mod.gradle')
