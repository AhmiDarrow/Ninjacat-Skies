plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

ext {
    mod_id = 'voidloom'
    mod_name = 'Voidloom'
    mod_description = 'Void yarn, spindle tools, and Loomframe sieving flair for Ninjacat Skies.'
}
apply from: rootProject.file('neoforge-mod.gradle')

dependencies {
    implementation project(':ninjacat-lib')
    compileOnly fileTree(dir: rootProject.file('../pack/mods'), include: [
            'exdeorum-*.jar',
    ])
}

neoForge {
    mods {
        ninjacatlib { sourceSet(project(':ninjacat-lib').sourceSets.main) }
    }
    runs {
        verification {
            type = 'gameTestServer'
            gameDirectory = project.file('build/verification')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'voidloom'
        }
    }
}
