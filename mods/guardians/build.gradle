plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

ext {
    mod_id = 'guardians'
    mod_name = 'Snapped Guardians'
    mod_description = 'The thirteen Snapped Guardians of Ninjacat Skies: totem-summoned boss arenas, custom-rendered bosses and the Woven Relics.'
}
apply from: rootProject.file('neoforge-mod.gradle')

dependencies {
    implementation project(':ninjacat-lib')
    implementation project(':ninjacatskies')
    implementation project(':clowderhall')
    localRuntime project(':voidloom')
    compileOnly fileTree(dir: rootProject.file('../pack/mods'), include: [
            'curios-neoforge-*.jar', 'ftb-teams-neoforge-*.jar', 'ftb-library-neoforge-*.jar', 'architectury-*.jar',
            'exdeorum-*.jar', 'productivebees-*.jar',
    ])
    // Productive Bees ships ProductiveLib as a nested (jar-in-jar) dependency; its hive block entities implement
    // ProductiveLib interfaces, so javac needs it on the classpath to compile against them. Unpack it beside the build.
    compileOnly fileTree(dir: compatLibs(), include: ['productivelib-*.jar'])
}

def compatLibs() {
    def dir = layout.buildDirectory.dir('compat').get().asFile
    fileTree(dir: rootProject.file('../pack/mods'), include: ['productivebees-*.jar']).each { jar ->
        copy {
            from(zipTree(jar)) { include 'META-INF/jarjar/productivelib-*.jar' }
            into dir
            eachFile { it.path = it.name }
            includeEmptyDirs = false
        }
    }
    return dir
}

evaluationDependsOn(':ninjacat-lib'); evaluationDependsOn(':ninjacatskies'); evaluationDependsOn(':clowderhall'); evaluationDependsOn(':voidloom')
neoForge {
    mods {
        ninjacatlib { sourceSet(project(':ninjacat-lib').sourceSets.main) }
        ninjacatskies { sourceSet(project(':ninjacatskies').sourceSets.main) }
        clowderhall { sourceSet(project(':clowderhall').sourceSets.main) }
        voidloom { sourceSet(project(':voidloom').sourceSets.main) }
    }
    runs {
        verification {
            type = 'gameTestServer'
            gameDirectory = project.file('build/verification')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'guardians'
            systemProperty 'guardians.arenaFallbackOverworld', 'true'
        }
        // Headless play test (tools/guardians_showcase.py drives it under Xvfb + llvmpipe): a flat server the driver owns
        // through RCON and a client that joins it and takes labelled screenshots.
        showcaseServer {
            type = 'server'
            gameDirectory = project.file('build/showcase-server')
            programArgument '--nogui'
            jvmArgument '-Xmx1500m'
        }
        showcaseClient {
            type = 'client'
            gameDirectory = project.file('build/showcase-client')
            jvmArgument '-Xmx3G'
            systemProperty 'guardians.showcase', 'true'
            programArguments.addAll '--username', 'GuardianQA', '--width', '1280', '--height', '720', '--quickPlayMultiplayer', '127.0.0.1:25599'
        }
    }
}
