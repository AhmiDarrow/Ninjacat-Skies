plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

ext {
    mod_id = 'driftwrecks'
    mod_name = 'Driftwrecks'
    mod_description = 'Driftwrecks for Ninjacat Skies: pieces of the old world that drift up to a Clowder\'s pad, hold for a while, then unravel. Loot, lore and the Wreck Atlas.'
}
apply from: rootProject.file('neoforge-mod.gradle')

dependencies {
    implementation project(':ninjacat-lib')
    implementation project(':ninjacatskies')
    implementation project(':clowderhall')
    implementation project(':guardians')
    localRuntime project(':voidloom')
    compileOnly fileTree(dir: rootProject.file('../pack/mods'), include: [
            'ftb-teams-neoforge-*.jar', 'ftb-library-neoforge-*.jar', 'architectury-*.jar',
    ])
}

evaluationDependsOn(':ninjacat-lib'); evaluationDependsOn(':ninjacatskies'); evaluationDependsOn(':clowderhall'); evaluationDependsOn(':voidloom'); evaluationDependsOn(':guardians')
neoForge {
    mods {
        ninjacatlib { sourceSet(project(':ninjacat-lib').sourceSets.main) }
        ninjacatskies { sourceSet(project(':ninjacatskies').sourceSets.main) }
        clowderhall { sourceSet(project(':clowderhall').sourceSets.main) }
        voidloom { sourceSet(project(':voidloom').sourceSets.main) }
        guardians { sourceSet(project(':guardians').sourceSets.main) }
    }
    runs {
        verification {
            type = 'gameTestServer'
            gameDirectory = project.file('build/verification')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'driftwrecks'
            systemProperty 'guardians.arenaFallbackOverworld', 'true'
        }
    }
}
