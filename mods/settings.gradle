pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ninjacat-skies-mods'

include 'ninjacat-lib'
include 'ninjacatskies'
include 'voidloom'
include 'clowderhall'
include 'guardians'
