plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

ext {
    mod_id = 'ninjacatskies'
    mod_name = 'Ninjacat Skies'
    mod_description = 'Core Codex, Skybound kits, and Strand story hooks for Ninjacat Skies.'
}
apply from: rootProject.file('neoforge-mod.gradle')

dependencies {
    implementation project(':ninjacat-lib')

    // Pack-shipped peers, compile-only (soft at runtime; see LoomTension / CodexBookHook).
    // Jars come from tools/download-mods.ps1 into pack/mods.
    compileOnly fileTree(dir: rootProject.file('../pack/mods'), include: [
            'ftb-teams-neoforge-*.jar',
            'ftb-library-neoforge-*.jar',
            'architectury-*-neoforge.jar',
            'modonomicon-*-neoforge-*.jar',
    ])
}

neoForge {
    mods {
        ninjacatlib { sourceSet(project(':ninjacat-lib').sourceSets.main) }
    }
    runs {
        verification {
            type = 'gameTestServer'
            gameDirectory = project.file('build/verification')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ninjacatskies'
        }
    }
}
