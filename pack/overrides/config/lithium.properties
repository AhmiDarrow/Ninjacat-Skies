# Lithium (NeoForge 0.15.4) for Ninjacat Skies.
# Everything else stays at Lithium's defaults. These mixin groups are off because another mod in the
# pack already overwrites the same methods, so Lithium would only half-apply them (the server and
# client boot logs showed "Method overwrite conflict ... Skipping method" for each):
#   chunk_tickets     - ModernFix's paper_chunk_patches SortedArraySetMixin owns SortedArraySet.removeIf
#   no_locking        - Saturn's threading_detector owns PalettedContainer.acquire/release
#   temperature_cache - Saturn's leaks.biome_temperature_cache owns Biome.getTemperature
#   composter         - Saturn's allocations.composter owns the composter inventories' getSlotsForFace
mixin.collections.chunk_tickets=false
mixin.chunk.no_locking=false
mixin.world.temperature_cache=false
mixin.alloc.composter=false
