[hardcore]
	#Shared Clowder lives. Every survival death spends one team life. Rare quest rewards add lives; operator /skybound revive restores the team.
	livesEnabled = true
	#Lives contributed once by each member to the shared team pool; operator revive restores this count times current members.
	# Default: 3
	# Range: 1 ~ 99
	startingLives = 3
	#On death, gather a player's dropped items into a Yarn Basket where they fell (or where they last stood, after a fall into the void). Only the owner, their Clowder or a creative player can open it.
	yarnBasket = true

[skybound]
	#Give a Whisker Codex the first time a player joins a world.
	giveCodexOnJoin = true
	#First-join kit extras only (wiped on pad claim). Real Easy/Normal/Hard = island template.
	difficultyPreset = "normal"

[loom]
	#Show the Fray: the cut in the sky at Loom's End, rooted in the void below the Hall and rising past the end of the broken gate-path, drawn on every client. It thins as Clowders seat Strands and turns to lit thread once every Clowder online has rewoven.
	frayEnabled = true
	#Fray X, in the Fray's dimension: the cut stands over this block.
	# Default: 0
	# Range: -30000000 ~ 30000000
	frayX = 0
	#Fray Y: the ground the cut passes; it is rooted 260 blocks below, in the void, and frays 200 blocks above.
	# Default: 63
	# Range: -64 ~ 320
	frayY = 63
	#Fray Z, in the Fray's dimension: the cut stands over this block.
	# Default: -140
	# Range: -30000000 ~ 30000000
	frayZ = -140
	#The dimension the Fray stands in: Loom's End (the Clowder Hall) by default.
	frayDimension = "clowderhall:clowder_hall"
	#Client: warm the horizon a little as your Clowder's Loom Tension rises.
	skyTint = true
	#Client: replace the Overworld sky with the sundered Loom (gold Cut, void tears). Disable for shader packs that draw their own sky.
	sunderedSky = true

[sleep]
	#Share of a dimension's online players who must sleep to pass the night there. Written to the playersSleepingPercentage gamerule on every server start. -1 leaves the gamerule alone.
	# Default: 25
	# Range: -1 ~ 100
	playersSleepingPercentage = 25
	#Under the Sundered sky's two suns the Overworld night runs at double speed (dusk to dawn in half the time). Off: vanilla-length nights.
	shortNights = true

[controls]
	#Vanilla sneak-to-dismount. Off: sneak only steers what you ride (a chocobo descends) and the Dismount key (Caps Lock by default) gets you off.
	sneakDismounts = false
